name: ci

# The Git Crafter CI standard (SoulCraft-Org/git-crafter templates/ci/README.md): one short job, the voice lint's
# self-test, then the lint over every Markdown file. Dependabot's github-actions entry bumps the pin.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's older run; a push to main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: SoulCraft-Org/git-crafter/.github/workflows/ci-standard.yml@8023bd4683416f6d420bd20d137960b09c06b91e # v7.0.2
    with:
      short: |
        python3 -I tools/voice_lint.py --self-test
        git ls-files -z '*.md' | xargs -0 python3 -I tools/voice_lint.py --rules tools/voice_rules.json
